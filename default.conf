server {
    listen 80;

    # Point to your web root directory
    root /www;

    # Match any request to /cgi-bin/ and route it via FastCGI
    location /cgi-bin/ {
        include fastcgi_params;
        
        # Route to the standalone fcgiwrap listener
        fastcgi_pass 127.0.0.1:9000;
        
        # Define how Nginx resolves the script's physical location
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
